[project]
name = "vansure"
version = "0.1.0"
description = "Multi-tenant school and college van management SaaS platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "VanSure Team", email = "team@vansure.com"}
]
keywords = ["school", "transport", "van", "management", "SaaS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # FastAPI and ASGI
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "geoalchemy2>=0.14.3,<0.15.0",
    
    # Validation
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    
    # Security
    "passlib[argon2]>=1.7.4,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "cryptography>=44.0.0,<45.0.0",
    
    # Cache and Queue
    "redis[hiredis]>=5.0.7,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "flower>=2.0.1,<3.0.0",
    
    # WebSocket
    "websockets>=15.0.0,<16.0.0",
    
    # HTTP clients
    "httpx>=0.27.0,<1.0.0",
    "httpcore>=0.30.0,<1.0.0",
    
    # Utilities
    "python-dotenv>=1.0.1,<2.0.0",
    "python-json-logger>=2.0.7,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "phonenumbers>=8.13.30,<9.0.0",
    "pytz>=2024.2,<2025.0",
    
    # Event handling
    "pyee>=9.0.0,<10.0.0",
    
    # Optional integrations
    "boto3>=1.35.0,<2.0.0",
    "FCM>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-httpx>=0.30.0,<1.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=33.0.0,<34.0.0",
    "respx>=0.22.0,<1.0.0",
    "freezegun>=1.5.0,<2.0.0",
    "coverage>=7.6.0,<8.0.0",
    "coverage-badge>=1.1.0,<2.0.0",
    "pytest-profiling>=1.9.0,<2.0.0",
]
lint = [
    "ruff>=0.9.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "types-setuptools>=69.0.0,<70.0.0",
    "types-redis>=5.0.0,<6.0.0",
    "types-Flask>=3.0.0,<4.0.0",
]
pre-commit = [
    "pre-commit>=3.8.0,<4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TID", # tidy-imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
separator-line-style = "asymmetrical"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
plugins = ["mypy.pluginsFunctional"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "security: marks tests as security tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "app/core/config.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]