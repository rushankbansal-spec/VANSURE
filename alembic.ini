[alembic]
script_location = app/migrations
sqlalchemy.url = driver://user:pass@localhost/db

# Logging configuration
[loggers]
default = WARNING, handlers
alembic = INFO, stdout
handlers = console

[handlers]
console = StreamHandler

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
generic =

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

# Post-processing configuration
[alembic:offline]
literal_binds = true
render_as_batch = true

[alembic:online]
render_as_batch = true